<!DOCTYPE html>
<html>
<head>
    <title>Latihan CSS</title>

    <style type="text/css">
        body {
            margin-left: 10%;
            margin-right: 10%;
        }

        h1 {
            margin-left: -8%;
        }

        h2, h3, h4, h5, h6 {
            margin-left: -4%;
        }

        h2 {
            margin-top: 8em;
            margin-bottom: 3em;
        }

        p {
            text-indent: 2em;
            margin-top: 0;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

<h1>Berita Utama</h1>

    <p>
        Elemen h1 digunakan untuk menandakan sebuah header dari teks
        (h1 == header 1). Konten teks ini sendiri berada di dalam
        sebuah paragraf, yang ditandai oleh elemen p.
    </p>

    <p>
        Paragraf kedua.
    </p>

</body>
</html>
